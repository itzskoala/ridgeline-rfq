[project]
name = "ridgeline-rfq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "numpy>=2.0",
    "openai>=1.50",
    "openpyxl>=3.1",
    "paddleocr>=3.0",
    "paddlepaddle>=3.3.1",
    "pdfplumber>=0.11",
    "pillow>=10.4",
    "pydantic>=2.8",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
]

[project.scripts]
ridgeline-rfq = "ridgeline_rfq:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
